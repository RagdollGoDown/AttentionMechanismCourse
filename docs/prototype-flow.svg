<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 530" width="1360" height="530" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <!-- Lesson flow of the Attention Seekers prototype. Edit by hand; render with docs/render-flow.sh. -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <style>
      .card  { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; }
      .title { font-size: 17px; font-weight: 700; }
      .sub   { font-size: 12px; fill: #94a3b8; }
      .chip  { font-size: 14px; fill: #1e293b; text-anchor: middle; dominant-baseline: central; }
      .num   { font-size: 12px; font-weight: 700; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }
      .flow  { stroke: #94a3b8; stroke-width: 2; fill: none; marker-end: url(#arr); }
      .tag   { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; }
      .ph    { fill: #f8fafc; stroke: #94a3b8; stroke-dasharray: 4 3; }
      .ex    { fill: #fff1e6; stroke: #f97316; stroke-width: 2; }
    </style>
  </defs>
  <rect width="1360" height="530" fill="#ffffff"/>

  <!-- 1 Start -->
  <rect class="card" x="40" y="40" width="190" height="230" rx="16"/>
  <circle cx="64" cy="68" r="12" fill="#64748b"/><text class="num" x="64" y="68">1</text>
  <text class="title" x="84" y="74" fill="#475569">Start</text>
  <rect x="60" y="94"  width="150" height="34" rx="17" fill="#f1f5f9"/><text class="chip" x="135" y="111">Welcome</text>
  <rect x="60" y="136" width="150" height="34" rx="17" fill="#f1f5f9"/><text class="chip" x="135" y="153">Hook</text>
  <rect x="60" y="178" width="150" height="34" rx="17" fill="#f1f5f9"/><text class="chip" x="135" y="195">Why attention?</text>
  <rect x="60" y="220" width="150" height="34" rx="17" class="ph"/><text class="chip" x="135" y="237" fill="#64748b">Pre-test</text>

  <!-- 2 Warm-up -->
  <rect class="card" x="270" y="40" width="170" height="230" rx="16"/>
  <circle cx="294" cy="68" r="12" fill="#0d9488"/><text class="num" x="294" y="68">2</text>
  <text class="title" x="314" y="74" fill="#0f766e">Warm-up</text>
  <rect x="290" y="94"  width="130" height="34" rx="17" fill="#e6f7f5"/><text class="chip" x="355" y="111">Vectors</text>
  <rect x="290" y="136" width="130" height="34" rx="17" fill="#e6f7f5"/><text class="chip" x="355" y="153">Dot product</text>
  <text class="sub" x="355" y="250" text-anchor="middle">skippable</text>

  <!-- 3 Sentence lab -->
  <rect class="card" x="480" y="40" width="400" height="230" rx="16"/>
  <circle cx="504" cy="68" r="12" fill="#2563eb"/><text class="num" x="504" y="68">3</text>
  <text class="title" x="524" y="74" fill="#1d4ed8">Sentence lab</text>
  <rect x="500" y="104" width="116" height="34" rx="17" fill="#eaf1fe"/><text class="chip" x="558" y="121">Contexts</text>
  <rect x="628" y="104" width="116" height="34" rx="17" fill="#eaf1fe"/><text class="chip" x="686" y="121">Query · Key</text>
  <rect x="756" y="104" width="116" height="34" rx="17" class="ex"/><text class="chip" x="814" y="121">Swap</text>
  <rect x="500" y="170" width="116" height="34" rx="17" class="ex"/><text class="chip" x="558" y="187">Remove</text>
  <rect x="628" y="170" width="116" height="34" rx="17" fill="#eaf1fe"/><text class="chip" x="686" y="187">Invent rule</text>
  <rect x="756" y="170" width="116" height="34" rx="17" fill="#eaf1fe"/><text class="chip" x="814" y="187">Softmax</text>
  <!-- small order numbers above each chip -->
  <g class="sub" text-anchor="middle">
    <text x="558" y="98">1</text><text x="686" y="98">2</text><text x="814" y="98">3</text>
    <text x="558" y="164">4</text><text x="686" y="164">5</text><text x="814" y="164">6</text>
  </g>
  <text class="sub" x="680" y="250" text-anchor="middle">one sentence · experiments unlock in order</text>

  <!-- 4 Formula -->
  <rect class="card" x="920" y="40" width="190" height="230" rx="16"/>
  <circle cx="944" cy="68" r="12" fill="#7c3aed"/><text class="num" x="944" y="68">4</text>
  <text class="title" x="964" y="74" fill="#6d28d9">Formula</text>
  <rect x="940" y="94"  width="150" height="34" rx="17" fill="#f3eefe"/><text class="chip" x="1015" y="111">Explore parts</text>
  <rect x="940" y="136" width="150" height="34" rx="17" class="ex"/><text class="chip" x="1015" y="153">Explain</text>
  <text class="sub" x="1015" y="250" text-anchor="middle">softmax(QKᵀ/√dₖ)·V</text>

  <!-- 5 Finish -->
  <rect class="card" x="1150" y="40" width="170" height="230" rx="16"/>
  <circle cx="1174" cy="68" r="12" fill="#64748b"/><text class="num" x="1174" y="68">5</text>
  <text class="title" x="1194" y="74" fill="#475569">Finish</text>
  <rect x="1170" y="94"  width="130" height="34" rx="17" class="ph"/><text class="chip" x="1235" y="111" fill="#64748b">Post-test</text>
  <rect x="1170" y="136" width="130" height="34" rx="17" fill="#f1f5f9"/><text class="chip" x="1235" y="153">Trophy</text>

  <!-- chapter arrows -->
  <path class="flow" d="M234,155 H266"/>
  <path class="flow" d="M444,155 H476"/>
  <path class="flow" d="M884,155 H916"/>
  <path class="flow" d="M1114,155 H1146"/>

  <!-- links from the orange steps down to the explain panel -->
  <path d="M680,270 V318" stroke="#f97316" stroke-width="2" stroke-dasharray="5 4" fill="none"/>
  <path d="M1015,270 V318" stroke="#f97316" stroke-width="2" stroke-dasharray="5 4" fill="none"/>

  <!-- Explain panel: the only difference between conditions -->
  <rect x="420" y="320" width="620" height="180" rx="16" fill="#fffaf5" stroke="#f97316" stroke-width="1.5"/>
  <text class="title" x="444" y="350" fill="#c2410c">Orange steps</text>
  <text class="sub" x="565" y="350" style="font-size:13px">the only part that differs between groups</text>

  <rect x="450" y="400" width="110" height="34" rx="17" fill="#ffffff" stroke="#f97316" stroke-width="1.5"/><text class="chip" x="505" y="417">Write</text>

  <text class="tag" x="640" y="379" fill="#059669">AI GROUP</text>
  <rect x="640" y="384" width="170" height="34" rx="17" fill="#e7f8f1" stroke="#10b981" stroke-width="1.5"/><text class="chip" x="725" y="401">Tutor hint</text>
  <text class="tag" x="640" y="447" fill="#7c3aed">CONTROL GROUP</text>
  <rect x="640" y="452" width="170" height="34" rx="17" fill="#f3eefe" stroke="#8b5cf6" stroke-width="1.5"/><text class="chip" x="725" y="469">Expert answer</text>

  <rect x="880" y="418" width="130" height="34" rx="17" fill="#ffffff" stroke="#f97316" stroke-width="1.5"/><text class="chip" x="945" y="435">Revise</text>
  <text class="sub" x="945" y="470" text-anchor="middle">optional</text>

  <path class="flow" d="M562,410 C600,410 600,401 636,401"/>
  <path class="flow" d="M562,424 C600,424 600,469 636,469"/>
  <path class="flow" d="M812,401 C850,401 845,428 876,430"/>
  <path class="flow" d="M812,469 C850,469 845,442 876,440"/>

  <!-- legend -->
  <g transform="translate(40,400)">
    <rect x="0" y="0" width="34" height="18" rx="9" class="ex"/><text x="44" y="13" style="font-size:12px" fill="#475569">explain step</text>
    <rect x="0" y="30" width="34" height="18" rx="9" class="ph"/><text x="44" y="43" style="font-size:12px" fill="#475569">placeholder</text>
  </g>
</svg>
